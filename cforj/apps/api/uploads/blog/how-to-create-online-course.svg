<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="40%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- Decorative blurred shapes -->
  <ellipse cx="300" cy="500" rx="300" ry="200" fill="white" opacity="0.04"/>
  <ellipse cx="900" cy="130" rx="250" ry="180" fill="white" opacity="0.04"/>

  <!-- Glow -->
  <circle cx="600" cy="200" r="110" fill="white" opacity="0.07"/>

  <!-- Rocket launch icon -->
  <g transform="translate(600, 195)" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Rocket body -->
    <path d="M0,-55 C-12,-55 -20,-30 -20,0 C-20,15 -15,25 0,40 C15,25 20,15 20,0 C20,-30 12,-55 0,-55 Z" fill="white" opacity="0.15" stroke="white"/>
    <!-- Nose cone tip -->
    <path d="M0,-55 C-5,-55 -8,-45 -8,-35" fill="none"/>
    <!-- Window -->
    <circle cx="0" cy="-15" r="8" fill="white" opacity="0.2"/>
    <!-- Left fin -->
    <path d="M-20,10 L-35,35 L-18,28" fill="white" opacity="0.1" stroke="white"/>
    <!-- Right fin -->
    <path d="M20,10 L35,35 L18,28" fill="white" opacity="0.1" stroke="white"/>
    <!-- Flame -->
    <path d="M-8,40 Q-5,55 0,65 Q5,55 8,40" stroke="#fde68a" stroke-width="2" fill="#fde68a" opacity="0.5"/>
    <path d="M-4,40 Q-2,50 0,58 Q2,50 4,40" stroke="#fbbf24" stroke-width="1.5" fill="#fbbf24" opacity="0.6"/>
    <!-- Exhaust particles -->
    <circle cx="-6" cy="70" r="2" fill="white" opacity="0.3"/>
    <circle cx="5" cy="75" r="1.5" fill="white" opacity="0.2"/>
    <circle cx="-2" cy="80" r="1" fill="white" opacity="0.15"/>
  </g>

  <!-- Small stars -->
  <g fill="white" opacity="0.15">
    <circle cx="470" cy="160" r="2"/>
    <circle cx="730" cy="140" r="2.5"/>
    <circle cx="510" cy="250" r="1.5"/>
    <circle cx="690" cy="270" r="1.5"/>
    <circle cx="450" cy="210" r="1"/>
    <circle cx="750" cy="200" r="1"/>
    <circle cx="530" cy="130" r="2"/>
    <circle cx="670" cy="120" r="1.8"/>
  </g>

  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
    How to Create
  </text>
  <text x="600" y="440" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
    an Online Course
  </text>

  <!-- Subtle divider -->
  <rect x="550" y="465" width="100" height="3" rx="1.5" fill="white" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="600" y="500" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" opacity="0.8">
    A step-by-step guide from idea to launch
  </text>

  <!-- cforj logo -->
  <text x="1150" y="600" text-anchor="end" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" opacity="0.5" letter-spacing="2">
    cforj
  </text>
</svg>