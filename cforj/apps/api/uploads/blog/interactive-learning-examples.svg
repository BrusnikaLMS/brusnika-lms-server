<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- Decorative shapes -->
  <circle cx="150" cy="550" r="200" fill="white" opacity="0.03"/>
  <circle cx="1050" cy="80" r="200" fill="white" opacity="0.03"/>

  <!-- Glow -->
  <circle cx="600" cy="210" r="105" fill="white" opacity="0.07"/>

  <!-- Puzzle pieces icon -->
  <g transform="translate(555, 160)" fill="white" opacity="0.85">
    <!-- Top-left piece -->
    <path d="M0,10 Q0,0 10,0 L30,0 L30,5 Q35,-2 40,5 L40,0 L50,0 Q55,0 55,5 L55,10 Q62,15 55,20 L55,30 Q55,35 50,35 L40,35 L40,30 Q35,37 30,30 L30,35 L10,35 Q0,35 0,25 Z" fill="white" opacity="0.2" stroke="white" stroke-width="1.5"/>
    <!-- Top-right piece -->
    <path d="M55,10 Q55,0 65,0 L90,0 Q95,0 95,5 L95,30 Q95,35 90,35 L80,35 L80,30 Q75,37 70,30 L70,35 L65,35 Q55,35 55,25 L55,20 Q48,15 55,10 Z" fill="white" opacity="0.25" stroke="white" stroke-width="1.5"/>
    <!-- Bottom-left piece -->
    <path d="M0,45 Q0,35 5,35 L30,35 L30,40 Q35,33 40,40 L40,35 L50,35 Q55,35 55,40 L55,45 Q62,50 55,55 L55,70 Q55,75 50,75 L10,75 Q0,75 0,65 Z" fill="white" opacity="0.15" stroke="white" stroke-width="1.5"/>
    <!-- Bottom-right piece -->
    <path d="M55,45 Q55,35 60,35 L70,35 L70,40 Q75,33 80,40 L80,35 L90,35 Q95,35 95,40 L95,70 Q95,75 90,75 L65,75 Q55,75 55,65 L55,55 Q48,50 55,45 Z" fill="white" opacity="0.3" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- Click/touch cursor accent -->
  <g transform="translate(650, 175)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <!-- Cursor hand pointer -->
    <path d="M0,30 L0,12 Q0,8 4,8 Q8,8 8,12 L8,20 L8,10 Q8,6 12,6 Q16,6 16,10 L16,20 L16,8 Q16,4 20,4 Q24,4 24,8 L24,20 L24,10 Q24,6 28,6 Q32,6 32,10 L32,28 Q32,40 22,44 L10,44 Q0,44 0,34 Z"/>
    <!-- Click ripples -->
    <circle cx="16" cy="0" r="8" opacity="0.3"/>
    <circle cx="16" cy="0" r="14" opacity="0.15"/>
  </g>

  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
    Interactive Learning
  </text>
  <text x="600" y="440" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
    Examples
  </text>

  <!-- Subtle divider -->
  <rect x="550" y="465" width="100" height="3" rx="1.5" fill="white" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="600" y="500" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" opacity="0.8">
    Engaging formats that boost learner retention
  </text>

  <!-- cforj logo -->
  <text x="1150" y="600" text-anchor="end" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" opacity="0.5" letter-spacing="2">
    cforj
  </text>
</svg>