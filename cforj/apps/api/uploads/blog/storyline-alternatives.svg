<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#a5f3fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Decorative shapes -->
  <circle cx="200" cy="150" r="200" fill="white" opacity="0.03"/>
  <circle cx="1000" cy="480" r="250" fill="white" opacity="0.03"/>

  <!-- Soft glow behind icon -->
  <circle cx="600" cy="220" r="100" fill="white" opacity="0.08"/>

  <!-- Arrows pointing to different options -->
  <g transform="translate(600, 220)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Center circle -->
    <circle cx="0" cy="0" r="20" fill="white" opacity="0.15" stroke="white" stroke-width="2.5"/>

    <!-- Arrow top-left -->
    <line x1="-20" y1="-15" x2="-65" y2="-55"/>
    <polyline points="-65,-40 -65,-55 -50,-55"/>
    <rect x="-100" y="-90" width="50" height="35" rx="8" fill="white" opacity="0.12" stroke="white" stroke-width="2"/>

    <!-- Arrow top-right -->
    <line x1="20" y1="-15" x2="65" y2="-55"/>
    <polyline points="50,-55 65,-55 65,-40"/>
    <rect x="50" y="-90" width="50" height="35" rx="8" fill="white" opacity="0.12" stroke="white" stroke-width="2"/>

    <!-- Arrow right -->
    <line x1="25" y1="0" x2="70" y2="0"/>
    <polyline points="58,-10 70,0 58,10"/>
    <rect x="78" y="-18" width="50" height="35" rx="8" fill="white" opacity="0.12" stroke="white" stroke-width="2"/>

    <!-- Arrow bottom-left -->
    <line x1="-20" y1="15" x2="-65" y2="55"/>
    <polyline points="-50,55 -65,55 -65,40"/>
    <rect x="-100" y="55" width="50" height="35" rx="8" fill="white" opacity="0.12" stroke="white" stroke-width="2"/>

    <!-- Arrow bottom-right -->
    <line x1="20" y1="15" x2="65" y2="55"/>
    <polyline points="50,55 65,55 65,40"/>
    <rect x="50" y="55" width="50" height="35" rx="8" fill="white" opacity="0.12" stroke="white" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="600" y="395" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" letter-spacing="-1">
    Storyline Alternatives
  </text>

  <!-- Subtle divider -->
  <rect x="550" y="420" width="100" height="3" rx="1.5" fill="white" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="600" y="462" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" opacity="0.8">
    Modern options for e-learning development
  </text>

  <!-- cforj logo -->
  <text x="1150" y="600" text-anchor="end" fill="white" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" opacity="0.5" letter-spacing="2">
    cforj
  </text>
</svg>